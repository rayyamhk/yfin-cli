[project]
name = "yfin-cli"
version = "0.3.0"
license = "MIT"
description = "A command-line interface for Yahoo Finance data"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "lxml>=6.0.2",
    "typer>=0.21.1",
    "yfinance>=1.8.0",
    "rich>=14.2.0",
]

[project.scripts]
yfin = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
markers = [
    "live: calls Yahoo Finance over the network (run with: pytest -m live)",
    "offline: mocked, no network; applied automatically to every non-live test (run with: pytest -m offline)",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.0",
]
